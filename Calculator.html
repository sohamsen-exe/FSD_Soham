<html>
    <head>
        <title>Calculator</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="calculator">
            <input type="text">
            <button class="clear">Clear</button>
            <div>
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button class="operator">÷</button>
            </div>
            <div>
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button class="operator">×</button>
            </div>
            <div>
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button class="operator">-</button>
            </div>
            <div>
                <button>.</button>
                <button>0</button>
                <button class="operator">=</button>
                <button class="operator">+</button> 
            </div>
        </div>
    </body>
</html>
