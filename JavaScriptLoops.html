<html>
    <head>
        <title>JavaScript Loops</title>
    </head>
    <body>
        <h1>JavaScript Loops</h1>

        <script>
            let a = 1;
            while (a <= 100) {
                document.write('Number :' + a + '<br>');
                a++;
            }
        </script>
    </body>
</html>
