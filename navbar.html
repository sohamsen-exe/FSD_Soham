<html>
    <head>
        <title> NavBar </title>
        <style>
            .nav{
                background-color: maroon;
                color: white;
                padding: 15px;
                display: flex;
                list-style-type: none;
                gap: 20px;
                justify-content: right;
                font-size: 20px;
            }
            button{
                background-color: yellow;
                color: blue;
                border: none;
                padding: 10px 20px;
                margin-top: 15px;
                font-weight: bold;
                font-size: 18px;
                font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            }
            button:hover{
                background-color: orange;
            }
        </style>
    </head>
    <body>
        <div class = 'nav'>
            <li><a href="home.com">Home</a></li>
            <li>Menu</li>
            <li>Services</li>
            <li>About</li>
        </div>
        <button> <a href="https://www.flipkart.com">Flipkart</a></button>
    </body>
</html>
