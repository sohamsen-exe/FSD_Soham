<html>
    <head>
        <title>Condition Statements in JavaScript</title>
    </head>
    <body>
        <h1>Condition Statements in JavaScript</h1>
        <script>
            let a = 100;
            
            if (a != 100){
                document.write("Condition is True");
            } else {
                document.write("Condition is False");
            }
        </script>
    </body>
</html>
