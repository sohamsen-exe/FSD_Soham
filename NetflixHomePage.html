<html>
    <head>
        <title>Netflix Home Page</title>
        <link rel="stylesheet" href="./NetflixStyle.css">
    </head>
    <body>
        <div class = 'navbar'>
            <img class = 'logo' src="./Netflix_Logo.svg">
            <li><select>
                <option>English</option>
                <option>Spanish</option>
                <option>French</option>
                <option>German</option>
            </select>
            </li>
            <li><button class = "sign-in">Sign In</button></li>
        </div>
        <div class = 'content'>
            <div class = 'text-center'>
                <h1 class = 'topline'>Unlimited movies,</h1>
                <h1 class = 'bottomline'>shows and more.</h1>
            </div>
            <h2>Starts at ₹149. Cancel any time.</h2>
            <h3>Ready to watch? Enter your email to create or restart your membership.</h3>
        </div>
        <div class = "emailget-started">
            <input class = 'email' type="text" placeholder="Email address">
            <button class = "get-started">Get Started ></button>
        </div>
    </body>
</html>
