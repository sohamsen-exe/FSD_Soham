<html>
    <head>
        <title>Weekdays</title>
    </head>
    <body>
        <h1>Weekdays Conditions</h1>
        <script>
            let day = prompt("Enter a day of the week:");

            if (day == 'Monday' || day == 'monday') {
                document.write("It's Monday!");
            } else if (day == 'Tuesday' || day == 'tuesday') {
                document.write("It's Tuesday!");
            } else if (day == 'Wednesday' || day == 'wednesday') {
                document.write("It's Wednesday!");
            } else if (day == 'Thursday' || day == 'thursday') {
                document.write("It's Thursday!");
            } else if (day == 'Friday' || day == 'friday') {
                document.write("It's Friday!");
            } else if (day == 'Saturday' || day == 'saturday') {
                document.write("It's Saturday!");
            } else if (day == 'Sunday' || day == 'sunday') {
                document.write("It's Sunday!");
            } else {
                document.write("That's not a valid day of the week.");
            }
        </script>
    </body>
</html>
