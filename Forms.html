<html>
    <head>
        <title>Forms</title>
        <style>
            h1{
                text-align:center;
            }
            form{
                border: 2px solid black;
                padding-bottom: 20px;
            }
            label, input{
                padding-left: 150px;
                margin-bottom: 10px;
            }
            input{
                width: 400px;
            }
            #i1{
                margin-left: 3px;
            }
            button{
                margin-left: 350px;
            }
        </style>
    </head>

    <body>
        <form>
            <h1>LOGIN FORM</h1>
            <label>Username:</label>
            <input type="text">
            <br><br>
            <label>Password:</label>
            <input id ='i1' type="password"><br><br>
            <button>Login</button>
        </form>
    </body>
</html>
