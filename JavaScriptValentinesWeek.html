<html>
    <head>
        <title>JavaScript Valentine's Week</title>
        <link rel="stylesheet" href="./ValentinesWeekStyles.css">
    </head>
    <body>
        <fieldset>
            <h1>Happy Valentine's Week!</h1>
            <label>Enter the day number of Valentine's Week (e.g., 7th, 8th, ..., 14th):</label>
            <br>
            <input type="number" id="dayInput" min="7" max="14">
            <button onclick="showDay()">Check</button>
            <br>
            <p id="output"></p>
            <script>
                function showDay() {
                    let day = document.getElementById("dayInput").value;
                    let output = document.getElementById("output");
                    switch(day) {
                        case '7':
                            output.innerHTML = "Rose Day: 🌹 A rose for your valentine!";
                            break;
                        case '8':
                            output.innerHTML = "Propose Day: 💍 Confess your feelings!";
                            break;
                        case '9':
                            output.innerHTML = "Chocolate Day: 🍫 Sweeten your relationship with chocolates!";
                            break;
                        case '10':
                            output.innerHTML = "Teddy Day: 🧸 Buy a cuddly teddy for your special someone!";
                            break;
                        case '11':
                            output.innerHTML = "Promise Day: 🤝 Make a promise to cherish each other!";
                            break;
                        case '12':
                            output.innerHTML = "Hug Day: 🫂 A warm hug to show you care!";
                            break;
                        case '13':
                            output.innerHTML = "Kiss Day: 💋 Seal your love with a kiss!";
                            break;
                        case '14':
                            output.innerHTML = "Valentine's Day: 💖 Celebrate!";
                            break;
                        default:
                            output.innerHTML = "Please enter a valid day number (7-14).";
                    }
                }
            </script>
        </fieldset>
    </body>
</html>
