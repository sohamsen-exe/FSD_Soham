<html>
    <head>
        <title> Alliance Login Page </title>
        <style>
            body{
                background: url('./campaus-banner_3.webp');
                background-size: cover;
            }
            .logo{
                display: block;
                margin-left: auto;
                margin-right: auto;
                width: 30%;
                padding-top: 100px;
                padding-bottom: 30px;
            }
            form{
                height: 450px;
                width: 400px;
                margin: auto;
                background-color: white;
            }
            .auerp{
                font-family: Arial;
                text-align: center;
                font-size: 13px;
                padding-top: 30px;
                color: #3C8DBC;
            }
            .faculty{
                padding-bottom: 20px;
                font-family: Arial;
                text-align: center;
                font-size: 17px;
                color: black;
            }
            input{
                display: block;
                margin-left: 20px;
                margin-top: 15px;
                width: 90%;
                font-size: 15px;
                padding: 8px;
            }
            .captcha{
                padding-top: 17px;
                margin-left: 20px;
            }
            .login{
                background-color: #3C8DBC;
                color: white;
                font-size: 15px;
                width: 25%;
                padding: 10px;
                margin-left: 280px;
                margin-top: 20px;
                border: none;
            }
            .forgot{
                margin-left: 20px;
                color: #3C8DBC;
                font-family: Arial;
                font-size: 14px;
            }
            .copyright{
                text-align: center;
                font-family: Arial;
                font-size: 12px;
                color: white;
                padding-top: 35px;
            }
            iframe {
                text-align: center;
            }
        </style>
    </head>
    <body>
        <img class = "logo" src="./AllianceUni_NAAC.png">
        <form>
            <p class = 'auerp'> Welcome to AUERP </p>
            <p class = 'faculty'> Faculty | Staff Login </p>
            <input type = "text" placeholder = "User Name" required>
            <input type = "password" placeholder = "Password" required>
            <img class = "captcha" src = './Captcha.png'>
            <input type = "text" placeholder = "Enter Captcha" required>
            <button class = 'login' type = "submit">Login</button>
            <p class = 'forgot'> Forgot Password </p>
            <p class = 'copyright'> Copyright © 2026 Alliance University. All Rights Reserved. </p>
        </form>
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d15566.831370269443!2d77.70787433596803!3d12.732472721397665!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bae6e511486348b%3A0xd89a0e9710f980c7!2sAlliance%20University!5e0!3m2!1sen!2sin!4v1770183250652!5m2!1sen!2sin" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </body>
</html>
